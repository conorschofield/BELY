OrgAboutDescription=Best Electronic Logbook Yet (BELY) serves as an essential logbook application at the Advanced Light Source (ALS) at Lawrence Berkeley National Laboratory (LBNL). Its primary purpose is to facilitate the organized recording of logbook entries, with an emphasis on chronological organization and the ability to group entries by task or shift. BELY offers exceptional flexibility by allowing users to define their own properties, tailoring the logbook to suit their specific requirements. Additionally, it provides robust search features, enhancing the efficiency of logbook entry retrieval and analysis.

